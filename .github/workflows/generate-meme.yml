name: Generate daily meme candidate
on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: meme-pipeline
  cancel-in-progress: false
env:
  GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Generate and send meme candidate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PUBLIC_BASE_URL: https://idarvinds.github.io/indian-meme-bot
        run: python -m src.pipeline generate
      - name: Save generated files and state
        if: always()
        run: |
          mkdir -p generated state
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add generated state
          if ! git diff --cached --quiet; then
            git commit -m 'Save meme generation state'
            git push origin HEAD:main
          fi
